# Python 3.11 because that is what the container carries.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llms
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --python 3.11
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
